name: Deploy to VM

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Deploy frontend
        run: rsync -av --delete frontend/dist/ /var/www/helpdesk/

      - name: Deploy backend
        run: |
          rsync -av --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.git' \
            backend/ /opt/helpdesk/backend/

      - name: Install backend dependencies
        run: cd /opt/helpdesk/backend && npm ci --omit=dev

      - name: Restart backend
        run: pm2 restart helpdesk-api --cwd /opt/helpdesk/backend || pm2 start /opt/helpdesk/backend/server.js --name helpdesk-api --cwd /opt/helpdesk/backend
