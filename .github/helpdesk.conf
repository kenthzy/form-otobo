# -- OTOBO mod_perl (unchanged) --
<IfModule !mod_perl.c>
    Error "mod_perl is required for Plack::Handler::Apache. Use apache2-httpd-cgi.include.conf as fallback."
</IfModule>

<IfModule mod_perl.c>
    <IfModule mpm_event_module>
        Error "The Multi-Processing Module mpm_event is active but it isn't supported by OTOBO. Please switch to mpm_prefork."
    </IfModule>
    <IfModule mpm_worker_module>
        Error "The Multi-Processing Module mpm_worker is active but it isn't supported by OTOBO. Please switch to mpm_prefork."
    </IfModule>

    PerlOptions +Parent
    PerlPostConfigRequire /opt/otobo/scripts/apache2-perl-preload_otobo_psgi.pl
</IfModule>

MaxConnectionsPerChild 1000

<VirtualHost *:80>
    ServerName _
    DocumentRoot /var/www/helpdesk

    <Directory /var/www/helpdesk>
        AllowOverride All
        Require all granted
    </Directory>

    # OTOBO only handles /otobo/ paths
    <Location /otobo/>
        SetHandler perl-script
        PerlResponseHandler Plack::Handler::Apache2
        PerlSetVar psgi_app /opt/otobo/bin/psgi-bin/otobo.psgi
        Require all granted
    </Location>

    RewriteEngine On
    # Skip OTOBO paths — let mod_perl handle them
    RewriteCond %{REQUEST_URI} ^/otobo
    RewriteRule ^ - [L]
    # Serve existing files
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f
    RewriteRule ^ - [L]
    # Directory index (/parking-request → /parking-request/index.html)
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
    RewriteRule ^(.+)$ /$1/index.html [L]
    # Fallback to root index.html
    RewriteRule ^ /index.html [L]

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3000/
    ProxyPassReverse /api/ http://127.0.0.1:3000/
</VirtualHost>
